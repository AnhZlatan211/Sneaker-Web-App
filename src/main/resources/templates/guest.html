<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnhSneaker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .home-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
        }
        .home-container h2 {
            color: #333;
        }
        .home-container p {
            font-size: 16px;
            color: #555;
        }
        .home-container a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .home-container a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="home-container">
    <h2>Welcome to Sneaker Web App</h2>
    <p>Hello Mother Fu**er!</p>
    <a th:href="@{/login}">Log in?</a>
    <a th:href="@{/signup}">Sign up?</a>
</div>

</body>
</html>
